<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <rect width="1600" height="1000" fill="#090909"/>
  <defs>
    <linearGradient id="studioGlow" x1="800" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1C1C" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#090909" stop-opacity="1"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="redLaser" x1="150" y1="540" x2="1450" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D2E" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E11D2E" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FF3045" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E11D2E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carSilhouette" x1="250" y1="360" x2="1350" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292929"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#292929"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#studioGlow)"/>
  <!-- Studio Overhead Light Bars -->
  <g opacity="0.35">
    <rect x="280" y="70" width="1040" height="10" fill="#FFFFFF"/>
    <rect x="360" y="130" width="880" height="6" fill="#A3A3A3"/>
    <rect x="440" y="180" width="720" height="4" fill="#292929"/>
    <line x1="180" y1="80" x2="40" y2="340" stroke="#292929" stroke-width="2"/>
    <line x1="1420" y1="80" x2="1560" y2="340" stroke="#292929" stroke-width="2"/>
  </g>
  <!-- Technical Grid -->
  <g stroke="#292929" stroke-width="1" opacity="0.45">
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="780" x2="1600" y2="780"/>
    <line x1="0" y1="880" x2="1600" y2="880"/>
    <line x1="800" y1="0" x2="800" y2="1000" stroke-dasharray="6 8"/>
    <line x1="400" y1="680" x2="150" y2="1000"/>
    <line x1="1200" y1="680" x2="1450" y2="1000"/>
  </g>
  <!-- Sport Coupe Silhouette Profile -->
  <path d="M230 635 C255 565, 340 530, 465 510 L650 405 C730 368, 910 362, 1045 415 L1235 495 C1315 510, 1380 545, 1395 625 L1360 650 L255 650 Z" fill="#141414" stroke="url(#carSilhouette)" stroke-width="3"/>
  <path d="M275 560 C440 490, 680 410, 995 430 C1150 442, 1295 505, 1365 565" stroke="url(#redLaser)" stroke-width="3" fill="none"/>
  <!-- Wheels -->
  <circle cx="445" cy="645" r="76" fill="#090909" stroke="#292929" stroke-width="6"/>
  <circle cx="445" cy="645" r="48" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="445" cy="645" r="14" fill="#E11D2E"/>
  <circle cx="1175" cy="645" r="76" fill="#090909" stroke="#292929" stroke-width="6"/>
  <circle cx="1175" cy="645" r="48" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="1175" cy="645" r="14" fill="#E11D2E"/>
  <!-- Placeholder Badge Frame -->
  <rect x="60" y="830" width="650" height="90" fill="#141414" stroke="#292929" stroke-width="1.5"/>
  <rect x="60" y="830" width="6" height="90" fill="#E11D2E"/>
  <text x="90" y="868" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="3">TEMPORARY STUDIO ASSET PLACEHOLDER</text>
  <text x="90" y="896" fill="#A3A3A3" font-family="monospace" font-size="13" letter-spacing="1.5">RESERVED FOR CLIENT PHOTOGRAPHY // QUIRICADA ST. STUDIO BAY</text>
</svg>
